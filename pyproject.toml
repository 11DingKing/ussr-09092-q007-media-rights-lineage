[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-rights-lineage"
version = "0.1.0"
description = "首发影像授权谱系基础服务"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pymongo>=4.9", "python-multipart>=0.0.12"]

[tool.setuptools.packages.find]
where = ["src"]
